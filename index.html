<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Column</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.92);
      --text: #18212f;
      --muted: #526175;
      --border: rgba(24, 33, 47, 0.09);
      --shadow: 0 18px 48px rgba(19, 30, 47, 0.14);
      --accent: #ffb547;
      --accent-soft: rgba(255, 181, 71, 0.18);
      --accent-strong: #e68f00;
      --chip: rgba(24, 33, 47, 0.06);
      --input: rgba(255, 255, 255, 0.85);
      --page-glow: radial-gradient(circle at top, rgba(255, 181, 71, 0.22), transparent 36%);
      font-family: "Comic Sans MS", "Comic Sans", "Trebuchet MS", Arial, sans-serif;
      font-size: 15px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #08111e;
        --panel: rgba(13, 23, 38, 0.82);
        --panel-strong: rgba(11, 20, 34, 0.94);
        --text: #eef4ff;
        --muted: #9bb1c9;
        --border: rgba(196, 214, 255, 0.1);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
        --chip: rgba(196, 214, 255, 0.08);
        --input: rgba(11, 20, 34, 0.82);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--accent) 12%, var(--bg)) 0%, var(--bg) 100%),
        var(--page-glow),
        var(--bg);
      color: var(--text);
      font: inherit;
    }

    .app {
      width: min(100%, 720px);
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero {
      padding: 22px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, var(--panel-strong)) 0%, var(--panel-strong) 80%),
        var(--panel-strong);
    }

    .search-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-form input,
    .search-form button {
      border: 1px solid var(--border);
      border-radius: 14px;
      font: inherit;
    }

    .search-form input {
      padding: 12px 14px;
      background: var(--input);
      color: var(--text);
    }

    .search-form button {
      padding: 12px 16px;
      background: var(--accent);
      color: #101721;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .search-form button:hover,
    .search-form button:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      flex-wrap: wrap;
    }

    .eyebrow,
    .meta,
    .status,
    .forecast p {
      color: var(--muted);
    }

    .eyebrow {
      margin: 0 0 6px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .location {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.05;
      margin-bottom: 10px;
    }

    .temperature {
      font-size: clamp(3rem, 11vw, 4.8rem);
      font-weight: 800;
      line-height: 0.92;
      margin-top: 6px;
    }

    .condition {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--chip);
      border-radius: 999px;
    }

    .status {
      margin-top: 14px;
      min-height: 1.4em;
    }

    .forecast {
      padding: 20px;
    }

    .news {
      padding: 20px;
    }

    .news-layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .news-column {
      display: grid;
      gap: 12px;
    }

    .news-list {
      display: grid;
      gap: 10px;
    }

    .news-item {
      display: grid;
      gap: 6px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--accent) 8%, var(--panel-strong));
      text-decoration: none;
      color: inherit;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .news-item:hover,
    .news-item:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .news-item p {
      color: var(--text);
      font-weight: 700;
      line-height: 1.35;
    }

    .news-item span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .air-quality {
      padding: 20px;
    }

    .air-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .air-card {
      padding: 16px 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--accent) 8%, var(--panel-strong));
      display: grid;
      gap: 8px;
    }

    .air-card strong {
      font-size: 1.4rem;
      line-height: 1;
    }

    .air-card span {
      color: var(--muted);
    }

    .forecast-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .forecast-card {
      padding: 16px 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--accent) 8%, var(--panel-strong));
      display: grid;
      gap: 8px;
      min-height: 144px;
    }

    .forecast-card .icon {
      font-size: 1.35rem;
    }

    .forecast-card h3 {
      font-size: 1rem;
    }

    .forecast-card strong {
      font-size: 1.12rem;
    }

    .loading {
      opacity: 0.75;
    }

    @media (max-width: 680px) {
      .news-layout {
        grid-template-columns: 1fr;
      }

      .air-grid,
      .forecast-grid {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }
    }

    @supports not (color: color-mix(in srgb, white, black)) {
      body {
        background: var(--bg);
      }

      .hero {
        background: var(--panel-strong);
      }

      .forecast-card {
        background: var(--panel-strong);
      }

      .air-card {
        background: var(--panel-strong);
      }

      .news-item {
        background: var(--panel-strong);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel hero">
      <form class="search-form" id="search-form">
        <input id="city-input" name="city" type="search" placeholder="Search for a city" aria-label="City name" autocomplete="off">
        <button type="submit">Search</button>
      </form>

      <div class="summary" id="summary">
        <div>
          <p class="eyebrow">Now</p>
          <h1 class="location" id="location-name">Chennai</h1>
          <p class="condition" id="condition-text">Loading current weather...</p>
          <div class="meta" id="meta"></div>
        </div>
        <div>
          <div class="temperature" id="temperature">--&deg;C</div>
        </div>
      </div>

      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <section class="panel air-quality">
      <div class="forecast-header">
        <div>
          <p class="eyebrow">Breathing room</p>
          <h2>Air quality</h2>
        </div>
        <p id="air-summary">Loading air quality...</p>
      </div>
      <div class="air-grid" id="air-grid"></div>
    </section>

    <section class="panel news">
      <div class="forecast-header">
        <div>
          <p class="eyebrow">Headlines</p>
          <h2>Important news</h2>
        </div>
        <p id="news-summary">Loading news...</p>
      </div>
      <div class="news-layout">
        <div class="news-column">
          <h3>India</h3>
          <div class="news-list" id="india-news"></div>
        </div>
        <div class="news-column">
          <h3>International</h3>
          <div class="news-list" id="world-news"></div>
        </div>
      </div>
    </section>

    <section class="panel forecast">
      <div class="forecast-header">
        <div>
          <p class="eyebrow">Outlook</p>
          <h2>5-day forecast</h2>
        </div>
        <p>Daily highs and lows</p>
      </div>
      <div class="forecast-grid" id="forecast-grid"></div>
    </section>
  </main>

  <script>
    const DEFAULT_CITY = "Chennai";
    const FALLBACK_DATA = {
      city: "Chennai",
      region: "Tamil Nadu, India",
      latitude: 13.0827,
      longitude: 80.2707,
      current: {
        temperature: 32,
        weatherCode: 1,
        isDay: 1
      },
      airQuality: {
        aqi: 78,
        pm2_5: 25,
        pm10: 41
      },
      daily: [
        { date: "2026-08-28", weatherCode: 1, max: 33, min: 28 },
        { date: "2026-08-29", weatherCode: 2, max: 34, min: 28 },
        { date: "2026-08-30", weatherCode: 3, max: 33, min: 27 },
        { date: "2026-08-31", weatherCode: 61, max: 31, min: 27 },
        { date: "2026-09-01", weatherCode: 80, max: 30, min: 26 }
      ]
    };

    const FALLBACK_NEWS = {
      india: [
        { title: "India market and policy updates will appear here when live headlines load.", source: "Built-in fallback", link: "#" },
        { title: "National weather, transport, and civic headlines can be shown in this section.", source: "Built-in fallback", link: "#" },
        { title: "Search for any city and keep an eye on important India stories alongside weather.", source: "Built-in fallback", link: "#" }
      ],
      world: [
        { title: "International headlines will appear here when the live news feed is reachable.", source: "Built-in fallback", link: "#" },
        { title: "Global politics, economy, and major world events can be displayed in this section.", source: "Built-in fallback", link: "#" },
        { title: "This fallback keeps the layout usable even if the news service is unavailable.", source: "Built-in fallback", link: "#" }
      ]
    };

    const codeMap = [
      { codes: [0], label: "Clear sky", iconDay: "☀️", iconNight: "🌙", accent: "#ffb547", accentStrong: "#d98200", soft: "rgba(255, 181, 71, 0.20)" },
      { codes: [1, 2], label: "Mostly clear", iconDay: "🌤️", iconNight: "☁️", accent: "#f0a34a", accentStrong: "#cc7d16", soft: "rgba(240, 163, 74, 0.20)" },
      { codes: [3, 45, 48], label: "Cloudy", iconDay: "☁️", iconNight: "☁️", accent: "#7ea8d9", accentStrong: "#4f7bad", soft: "rgba(126, 168, 217, 0.18)" },
      { codes: [51, 53, 55, 56, 57], label: "Drizzle", iconDay: "🌦️", iconNight: "🌧️", accent: "#69a7cf", accentStrong: "#3b7aa3", soft: "rgba(105, 167, 207, 0.18)" },
      { codes: [61, 63, 65, 66, 67, 80, 81, 82], label: "Rain", iconDay: "🌧️", iconNight: "🌧️", accent: "#5f8fff", accentStrong: "#315fd1", soft: "rgba(95, 143, 255, 0.20)" },
      { codes: [71, 73, 75, 77, 85, 86], label: "Snow", iconDay: "❄️", iconNight: "❄️", accent: "#78d4d4", accentStrong: "#3aa5a5", soft: "rgba(120, 212, 212, 0.18)" },
      { codes: [95, 96, 99], label: "Thunderstorm", iconDay: "⛈️", iconNight: "⛈️", accent: "#ad7cff", accentStrong: "#7b43df", soft: "rgba(173, 124, 255, 0.20)" }
    ];

    const els = {
      form: document.getElementById("search-form"),
      input: document.getElementById("city-input"),
      location: document.getElementById("location-name"),
      condition: document.getElementById("condition-text"),
      temperature: document.getElementById("temperature"),
      meta: document.getElementById("meta"),
      airSummary: document.getElementById("air-summary"),
      airGrid: document.getElementById("air-grid"),
      newsSummary: document.getElementById("news-summary"),
      indiaNews: document.getElementById("india-news"),
      worldNews: document.getElementById("world-news"),
      status: document.getElementById("status"),
      forecast: document.getElementById("forecast-grid"),
      summary: document.getElementById("summary")
    };

    function getWeatherPresentation(code, isDay) {
      const match = codeMap.find((entry) => entry.codes.includes(code)) || codeMap[2];
      return {
        label: match.label,
        icon: isDay ? match.iconDay : match.iconNight,
        accent: match.accent,
        accentStrong: match.accentStrong,
        soft: match.soft
      };
    }

    function setThemeFromWeather(code, isDay) {
      const theme = getWeatherPresentation(code, isDay);
      document.documentElement.style.setProperty("--accent", theme.accent);
      document.documentElement.style.setProperty("--accent-strong", theme.accentStrong);
      document.documentElement.style.setProperty("--accent-soft", theme.soft);
      document.documentElement.style.setProperty("--page-glow", `radial-gradient(circle at top, ${theme.soft}, transparent 36%)`);
    }

    function formatDay(dateText) {
      const date = new Date(`${dateText}T12:00:00`);
      return new Intl.DateTimeFormat(undefined, { weekday: "short" }).format(date);
    }

    function formatFullDate(dateText) {
      const date = new Date(`${dateText}T12:00:00`);
      return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(date);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function describeAirQuality(aqi) {
      if (aqi <= 50) {
        return "Good";
      }
      if (aqi <= 100) {
        return "Moderate";
      }
      if (aqi <= 150) {
        return "Unhealthy for sensitive groups";
      }
      if (aqi <= 200) {
        return "Unhealthy";
      }
      if (aqi <= 300) {
        return "Very unhealthy";
      }
      return "Hazardous";
    }

    function buildFallbackForCity(cityName) {
      return {
        ...FALLBACK_DATA,
        city: cityName || FALLBACK_DATA.city,
        region: cityName && cityName !== FALLBACK_DATA.city ? "Built-in sample forecast" : FALLBACK_DATA.region
      };
    }

    function renderNewsSection(container, items) {
      container.innerHTML = items.map((item) => `
        <a class="news-item" href="${escapeHtml(item.link || "#")}" ${item.link && item.link !== "#" ? 'target="_blank" rel="noreferrer"' : ""}>
          <p>${escapeHtml(item.title)}</p>
          <span>${escapeHtml(item.source || "News feed")}</span>
        </a>
      `).join("");
    }

    function renderNews(data, summaryText) {
      renderNewsSection(els.indiaNews, data.india);
      renderNewsSection(els.worldNews, data.world);
      els.newsSummary.textContent = summaryText;
    }

    function renderWeather(data, statusMessage) {
      const currentTheme = getWeatherPresentation(data.current.weatherCode, data.current.isDay);
      setThemeFromWeather(data.current.weatherCode, data.current.isDay);

      els.location.textContent = data.city;
      els.condition.textContent = `${currentTheme.icon} ${currentTheme.label}`;
      els.temperature.innerHTML = `${Math.round(data.current.temperature)}&deg;C`;
      els.meta.innerHTML = `
        <span class="chip">${data.region}</span>
        <span class="chip">${Math.abs(data.latitude).toFixed(2)}&deg; ${data.latitude >= 0 ? "N" : "S"}</span>
        <span class="chip">${Math.abs(data.longitude).toFixed(2)}&deg; ${data.longitude >= 0 ? "E" : "W"}</span>
        <span class="chip">AQI ${Math.round(data.airQuality.aqi)} · ${describeAirQuality(data.airQuality.aqi)}</span>
      `;

      els.airSummary.textContent = `${describeAirQuality(data.airQuality.aqi)} air right now`;
      els.airGrid.innerHTML = `
        <article class="air-card">
          <p class="eyebrow">US AQI</p>
          <strong>${Math.round(data.airQuality.aqi)}</strong>
          <span>${describeAirQuality(data.airQuality.aqi)}</span>
        </article>
        <article class="air-card">
          <p class="eyebrow">PM2.5</p>
          <strong>${Math.round(data.airQuality.pm2_5)}</strong>
          <span>&micro;g/m&sup3;</span>
        </article>
        <article class="air-card">
          <p class="eyebrow">PM10</p>
          <strong>${Math.round(data.airQuality.pm10)}</strong>
          <span>&micro;g/m&sup3;</span>
        </article>
      `;

      els.forecast.innerHTML = data.daily.slice(0, 5).map((day) => {
        const details = getWeatherPresentation(day.weatherCode, 1);
        return `
          <article class="forecast-card">
            <div class="icon" aria-hidden="true">${details.icon}</div>
            <div>
              <h3>${formatDay(day.date)}</h3>
              <p>${formatFullDate(day.date)}</p>
            </div>
            <strong>${Math.round(day.max)}&deg; / ${Math.round(day.min)}&deg;</strong>
            <p>${details.label}</p>
          </article>
        `;
      }).join("");

      els.status.textContent = statusMessage || "";
      els.summary.classList.remove("loading");
    }

    async function fetchCoordinates(city) {
      const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
      if (!response.ok) {
        throw new Error("Unable to look up that city.");
      }

      const payload = await response.json();
      const place = payload.results && payload.results[0];
      if (!place) {
        return null;
      }

      const parts = [place.admin1, place.country].filter(Boolean);
      return {
        city: place.name,
        region: parts.join(", "),
        latitude: place.latitude,
        longitude: place.longitude
      };
    }

    async function fetchAirQuality(location) {
      const params = new URLSearchParams({
        latitude: location.latitude,
        longitude: location.longitude,
        current: "us_aqi,pm2_5,pm10",
        timezone: "auto"
      });

      const response = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${params.toString()}`);
      if (!response.ok) {
        throw new Error("Unable to fetch air quality right now.");
      }

      const payload = await response.json();
      return {
        aqi: payload.current.us_aqi,
        pm2_5: payload.current.pm2_5,
        pm10: payload.current.pm10
      };
    }

    async function fetchNewsFeed(url) {
      const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
      const response = await fetch(proxyUrl);
      if (!response.ok) {
        throw new Error("Unable to fetch news right now.");
      }

      const payload = await response.json();
      if (payload.status !== "ok" || !Array.isArray(payload.items)) {
        throw new Error("News feed returned an unexpected response.");
      }

      return payload.items.slice(0, 4).map((item) => ({
        title: item.title,
        source: item.author || payload.feed.title || "News feed",
        link: item.link
      }));
    }

    async function loadNews() {
      try {
        const [india, world] = await Promise.all([
          fetchNewsFeed("https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en"),
          fetchNewsFeed("https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en")
        ]);
        renderNews({ india, world }, "Live headlines from public RSS feeds");
      } catch (error) {
        renderNews(FALLBACK_NEWS, "Live news is unavailable, so you're seeing built-in fallback headlines");
      }
    }

    async function fetchForecast(location) {
      const params = new URLSearchParams({
        latitude: location.latitude,
        longitude: location.longitude,
        current: "temperature_2m,weather_code,is_day",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        forecast_days: "6",
        timezone: "auto"
      });

      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
      if (!response.ok) {
        throw new Error("Unable to fetch weather right now.");
      }

      const payload = await response.json();
      return {
        city: location.city,
        region: location.region,
        latitude: location.latitude,
        longitude: location.longitude,
        current: {
          temperature: payload.current.temperature_2m,
          weatherCode: payload.current.weather_code,
          isDay: payload.current.is_day
        },
        daily: payload.daily.time.slice(1, 6).map((date, index) => ({
          date,
          weatherCode: payload.daily.weather_code[index + 1],
          max: payload.daily.temperature_2m_max[index + 1],
          min: payload.daily.temperature_2m_min[index + 1]
        }))
      };
    }

    async function loadWeather(city, isInitialLoad) {
      const trimmed = city.trim();
      if (!trimmed) {
        els.status.textContent = "Enter a city name to search.";
        return;
      }

      els.summary.classList.add("loading");
      els.status.textContent = isInitialLoad ? "Loading Chennai weather..." : `Loading weather for ${trimmed}...`;

      try {
        const location = await fetchCoordinates(trimmed);
        if (!location) {
          els.status.textContent = `No match found for "${trimmed}".`;
          els.summary.classList.remove("loading");
          return;
        }

        const [weather, airQuality] = await Promise.all([
          fetchForecast(location),
          fetchAirQuality(location)
        ]);
        renderWeather({ ...weather, airQuality }, `Live data from Open-Meteo for ${location.city}.`);
      } catch (error) {
        const fallback = buildFallbackForCity(trimmed);
        renderWeather(fallback, `Live data is unavailable, so you're seeing built-in fallback data${trimmed ? ` for ${fallback.city}` : ""}.`);
      }
    }

    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      loadWeather(els.input.value || DEFAULT_CITY, false);
    });

    els.input.value = DEFAULT_CITY;
    renderWeather(FALLBACK_DATA, "Loading live data from Open-Meteo...");
    renderNews(FALLBACK_NEWS, "Loading live headlines...");
    loadWeather(DEFAULT_CITY, true);
    loadNews();
  </script>
</body>
</html>
